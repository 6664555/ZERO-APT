name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suites (offline — mock LLM, no VM/ELK required)
        run: |
          python tests/test_core_mechanisms.py
          python tests/test_defender_rules.py
          python tests/test_metrics_stats.py
          python tests/test_harness_dryrun.py
          python tests/test_stix_export.py
